<svg xmlns="http://www.w3.org/2000/svg" width="720" height="220" viewBox="0 0 720 220" role="img" aria-label="Water Us: keep your houseplants happy">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c3d2a"/>
      <stop offset="1" stop-color="#2f9e6a"/>
    </linearGradient>
    <linearGradient id="leafA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8be0ae"/>
      <stop offset="1" stop-color="#34a06c"/>
    </linearGradient>
    <linearGradient id="leafB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ad08f"/>
      <stop offset="1" stop-color="#17704b"/>
    </linearGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf8ff"/>
      <stop offset="1" stop-color="#7cc7f2"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.86" cy="0.1" r="0.55">
      <stop offset="0" stop-color="#fff4c2" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff4c2" stop-opacity="0"/>
    </radialGradient>
    <path id="leaf" d="M0 0 C 24 -62 150 -92 250 -28 C 160 30 52 38 0 0 Z"/>
    <clipPath id="card"><rect width="720" height="220" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="720" height="220" fill="url(#bg)"/>
    <rect width="720" height="220" fill="url(#sun)"/>
    <use href="#leaf" fill="url(#leafB)" transform="translate(-20 235) rotate(-62) scale(1.1)"/>
    <use href="#leaf" fill="url(#leafA)" transform="translate(-10 240) rotate(-28) scale(0.95)"/>
    <use href="#leaf" fill="url(#leafB)" transform="translate(740 235) scale(-1.1 1.1) rotate(-62)"/>
    <use href="#leaf" fill="url(#leafA)" transform="translate(730 240) scale(-0.95 0.95) rotate(-28)"/>
    <path d="M360 16 C372 36 380 46 380 56 A20 20 0 0 1 340 56 C340 46 348 36 360 16 Z" fill="url(#drop)"/>
    <text x="360" y="140" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="68" font-weight="700" fill="#ffffff">Water Us</text>
    <text x="360" y="180" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" fill="#d7f5e4">Keep your houseplants happy</text>
  </g>
</svg>
